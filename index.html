// week 0 (weekOffset) starts on this Sunday
const BASE_SUNDAY = new Date(2026, 7, 30); // dim. 30 août 2026

function weekDates(weekOffset) {
  const start = new Date(BASE_SUNDAY);
  start.setDate(BASE_SUNDAY.getDate() + weekOffset * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
}

function isHolidayMonday(date) {
  return date.getFullYear() === 2026 && date.getMonth() === 8 && date.getDate() === 7; // lundi 7 sept. 2026
}

function isToday(date) {
  return date.getFullYear() === 2026 && date.getMonth() === 7 && date.getDate() === 31; // lundi 31 août 2026
}

// events for a given lundi..vendredi index (0-4) within a specific week
function scheduleForDayInWeek(dayIdx, weekOffset) {
  const dates = weekDates(weekOffset);
  const date = dates[dayIdx + 1]; // dates[0] is dimanche
  if (dayIdx === 0 && isHolidayMonday(date)) return [];
  return SCHEDULE.filter((e) => e.day === dayIdx);
}

// course codes present on an arbitrary calendar date (used by the Mois view)
function eventCodesForDate(date) {
  const wd = date.getDay(); // 0=dim .. 6=sam
  if (wd === 0 || wd === 6) return [];
  if (wd === 1) return isHolidayMonday(date) ? [] : ["MAT210", "LOG121"];
  if (wd === 2) return ["GIA400"];
  if (wd === 3) return ["ING150", "LOG121"];
  if (wd === 4) return ["GIA400"];
  if (wd === 5) return ["ING150", "MAT210"];
  return [];
}

function fmtHour(h) {
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}


function weightedAverage(gradeItems) {
  const totalWeight = gradeItems.reduce((s, gi) => s + (Number(gi.weight) || 0), 0);
  if (totalWeight === 0) return null;
  const earned = gradeItems.reduce((s, gi) => {
    const pct = gi.outOf ? Number(gi.score) / Number(gi.outOf) : 0;
    return s + pct * (Number(gi.weight) || 0);
  }, 0);
  return (earned / totalWeight) * 100;
}

// ---------- gauge ----------
function Gauge({ value, size = 84, centerText }) {
  const r = (size - 10) / 2;
  const c = 2 * Math.PI * r;
  const pct = value == null ? 0 : Math.max(0, Math.min(100, value));
  const ringColor = value == null ? C.ringTrack : pct >= 80 ? C.green : pct >= 60 ? C.yellow : "#FF3B30";
  return (
    <svg width={size} height={size} style={{ flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.ringTrack} strokeWidth="6" />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        fill="none"
        stroke={ringColor}
        strokeWidth="6"
        strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={c - (pct / 100) * c}
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset 0.4s ease" }}
      />
      <text
        x="50%"
        y="52%"
        textAnchor="middle"
        dominantBaseline="middle"
        fill={C.text}
        fontWeight="600"
        fontSize={size * 0.22}
      >
        {centerText}
      </text>
    </svg>
  );
}

function NotesSection({ courses, termsInOrder, onOpenCourse }) {
  return (
    <>
      {termsInOrder.map((term) => {
        const termCourses = courses.filter((c) => c.term === term);
        return (
          <section key={term} style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
              <h2 style={{ fontSize: 15, fontWeight: 700, color: C.red, margin: 0 }}>{term}</h2>
              <CalendarIcon color={C.muted} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 5 }}>
              {termCourses.map((c) => {
                const finalPct = weightedAverage(c.gradeItems);
                const label = c.cote || (finalPct == null ? "—" : `${Math.round(finalPct)} %`);
                return (
                  <button
                    key={c.id}
                    onClick={() => onOpenCourse(c.id)}
                    style={{
                      borderRadius: 10,
                      overflow: "hidden",
                      textAlign: "left",
                      border: "none",
                      padding: 0,
                      cursor: "pointer",
                    }}
                  >
                    <div style={{ backgroundColor: C.red, color: C.text, padding: "5px 5px", textAlign: "center", fontWeight: 700, fontSize: 11 }}>
                      {c.code}
                    </div>
                    <div style={{ backgroundColor: C.card, padding: "13px 4px", textAlign: "center" }}>
                      <span style={{ fontSize: 21, fontWeight: 700, color: "#C7C7CC" }}>{label}</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </section>
        );
      })}
    </>
  );
}

const HORAIRE_START = 8;
const HORAIRE_END = 22;
const HOUR_PX = 52;

const MONTH_NAMES = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

function buildMonthGrid(year, monthIdx) {
  const firstOfMonth = new Date(year, monthIdx, 1);
  const startOffset = firstOfMonth.getDay(); // 0=dim
  const gridStart = new Date(year, monthIdx, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    cells.push(d);
  }
  return cells;
}

function HoraireSection() {
  const [showExport, setShowExport] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showToday, setShowToday] = useState(true);
  const [calendarFormat, setCalendarFormat] = useState("Semaine");
  const [weekOffset, setWeekOffset] = useState(0);
  const [selectedDay, setSelectedDay] = useState(1); // index into weekDates(): 0=dim .. 1=lundi (today)
  const [monthCursor, setMonthCursor] = useState({ year: 2026, month: 7 }); // août 2026

  const hours = [];
  for (let h = HORAIRE_START; h <= HORAIRE_END; h++) hours.push(h);
  const gridHeight = (HORAIRE_END - HORAIRE_START) * HOUR_PX;
  const monthCells = buildMonthGrid(monthCursor.year, monthCursor.month);

  const dates = weekDates(weekOffset);
  const rangeLabel = `Du ${dates[0].getDate()} ${MONTH_SHORT[dates[0].getMonth()]} au ${dates[6].getDate()} ${MONTH_SHORT[dates[6].getMonth()]}`;

  const stepDay = (delta) => {
    setSelectedDay((d) => {
      let next = d + delta;
      if (next < 0) {
        setWeekOffset((w) => w - 1);
        next = 6;
      } else if (next > 6) {
        setWeekOffset((w) => w + 1);
        next = 0;
      }
      return next;
    });
  };

  const Legend = () => (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 20 }}>
      {Object.entries(SCHED_COLORS).map(([code, color]) => {
        const section = SCHEDULE.find((e) => e.code === code)?.section || code;
        return (
          <div key={code} style={{ display: "flex", alignItems: "center", gap: 6, backgroundColor: C.card, borderRadius: 999, padding: "6px 10px" }}>
            <div style={{ width: 10, height: 10, borderRadius: "50%", backgroundColor: color }} />
            <span style={{ fontSize: 12, color: C.text, fontWeight: 600 }}>{section}</span>
          </div>
        );
      })}
    </div>
  );

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", paddingTop: 32, paddingBottom: 20 }}>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>Horaire</h1>
        <div style={{ display: "flex", gap: 18 }}>
          <button onClick={() => setShowExport(true)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
            <ExportIcon color={C.muted} />
          </button>
          <CalendarIcon color={C.muted} size={22} />
          <button onClick={() => setShowSettings(true)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
            <GearIcon color={C.muted} />
          </button>
        </div>
      </div>

      {calendarFormat === "Jour" ? (
        <>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
            <button onClick={() => stepDay(-1)} style={{ background: "none", border: "none", color: C.muted, fontSize: 22, cursor: "pointer" }}>
              ‹
            </button>
            <span style={{ fontSize: 20, color: C.text }}>
              {DAY_NAMES_FULL[selectedDay]} {dates[selectedDay].getDate()} {MONTH_SHORT[dates[selectedDay].getMonth()]}
            </span>
            <button onClick={() => stepDay(1)} style={{ background: "none", border: "none", color: C.muted, fontSize: 22, cursor: "pointer" }}>
              ›
            </button>
          </div>

          <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
            {dates.map((d, i) => {
              const count = i >= 1 && i <= 5 ? scheduleForDayInWeek(i - 1, weekOffset).length : 0;
              const selected = i === selectedDay;
              return (
                <button
                  key={i}
                  onClick={() => setSelectedDay(i)}
                  style={{ flex: 1, position: "relative", background: "none", border: "none", cursor: "pointer", padding: 0 }}
                >
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>{WEEK_SHORT[i]}</div>
                  <div
                    style={{
                      border: selected ? `2px solid ${C.red}` : "2px solid transparent",
                      borderRadius: 10,
                      padding: "6px 0",
                      fontSize: 17,
                      fontWeight: 600,
                      color: C.text,
                    }}
                  >
                    {d.getDate()}
                  </div>
                  {count > 0 && (
                    <span
                      style={{
                        position: "absolute",
                        top: -4,
                        right: 2,
                        backgroundColor: C.red,
                        color: C.text,
                        fontSize: 10,
                        fontWeight: 700,
                        borderRadius: 999,
                        width: 16,
                        height: 16,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                      }}
                    >
                      {count}

          </div>

          <div style={{ display: "flex" }}>
            <div style={{ width: 40, flexShrink: 0, position: "relative", height: gridHeight }}>
              {hours.map((h) => (
                <div key={h} style={{ position: "absolute", top: (h - HORAIRE_START) * HOUR_PX - 7, right: 4, fontSize: 12, color: C.muted }}>

              {hours.map((h) => (
                <div key={h} style={{ position: "absolute", left: 0, right: 0, top: (h - HORAIRE_START) * HOUR_PX, borderTop: `1px solid ${C.border}` }} />
              ))}
              {(selectedDay >= 1 && selectedDay <= 5 ? scheduleForDayInWeek(selectedDay - 1, weekOffset) : []).map((e, i) => (
                <div
                  key={i}
                  style={{
                    position: "absolute",
                    left: 2,
                    right: 2,
                    top: (e.start - HORAIRE_START) * HOUR_PX,

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
            {monthCells.map((d, i) => {
              const inMonth = d.getMonth() === monthCursor.month;
              const events = eventCodesForDate(d);

              return (
                <div key={i} style={{ borderTop: `1px solid ${C.border}`, borderLeft: i % 7 > 0 ? `1px solid ${C.border}` : "none", padding: "6px 3px", minHeight: 74 }}>

                      width: 26,

                </div>
              ))}
            </div>
          </div>
          <Legend />
        </>
      )}

      {showExport && <ExportModal onCancel={() => setShowExport(false)} onExport={() => setShowExport(false)} />}
      {showSettings && (
        <SettingsSheet
          showToday={showToday}
          onToggleToday={() => setShowToday((v) => !v)}
          format={calendarFormat}
          onSetFormat={setCalendarFormat}
          onClose={() => setShowSettings(false)}
        />
      )}
    </div>
  );
}

// ---------- app ----------
function App() {
  const [courses, setCourses] = useState(null);
  const [openCourseId, setOpenCourseId] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [activeTab, setActiveTab] = useState("accueil");
  const [etudiantTab, setEtudiantTab] = useState("profil");
  const [plusPage, setPlusPage] = useState(null);
  const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);

  useEffect(() => {
    (async () => {
      let storedVersion = 0;
      try {
        const v = localStorage.getItem("dataVersion");
        storedVersion = v ? Number(v) : 0;
      } catch {
        storedVersion = 0;
      }

      if (storedVersion < CURRENT_VERSION) {
        const seeded = seedCourses();
        setCourses(seeded);
        try {
          localStorage.setItem("courses", JSON.stringify(seeded));
          localStorage.setItem("dataVersion", String(CURRENT_VERSION));
        } catch {
          // non-fatal
        }
      } else {
        try {
          const res = localStorage.getItem("courses");
          const parsed = res ? JSON.parse(res) : null;
          setCourses(parsed && parsed.length ? parsed : seedCourses());
        } catch {
          setCourses(seedCourses());
        }
      }
      setLoaded(true);
    })();
  }, []);

  if (!loaded) {
    return (
      <div style={{ minHeight: "100vh", backgroundColor: C.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: C.muted, fontSize: 14 }}>chargement…</div>
      </div>
    );
  }

  const openCourse = courses.find((c) => c.id === openCourseId);
  const termsInOrder = [...new Set(courses.map((c) => c.term))].sort((a, b) => termRank(a) - termRank(b));

  return (
    <div style={{ minHeight: "100vh", backgroundColor: C.bg, color: C.text, fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <div style={{ maxWidth: 448, margin: "0 auto", padding: "0 16px 96px" }}>
        {openCourse ? (
          <CourseDetail course={openCourse} onBack={() => setOpenCourseId(null)} />
        ) : activeTab === "horaire" ? (
          <HoraireSection />
        ) : activeTab === "etudiant" ? (
          <>
            <header style={{ paddingTop: 32, paddingBottom: 16 }}>
              <h1 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>Étudiant</h1>
            </header>

            <div style={{ display: "flex", borderBottom: `1px solid ${C.border}`, marginBottom: 20 }}>
              {[
                ["notes", "Notes"],
                ["profil", "Profil"],
              ].map(([key, label]) => (
                <button
                  key={key}
                  onClick={() => setEtudiantTab(key)}
                  style={{
                    flex: 1,
                    background: "none",
                    border: "none",
                    padding: "0 0 12px",
                    cursor: "pointer",
                    fontSize: 16,
                    fontWeight: 600,
                    color: etudiantTab === key ? C.text : C.muted,
                    borderBottom: etudiantTab === key ? `2px solid ${C.text}` : "2px solid transparent",
                  }}
                >
                  {label}
                </button>
              ))}
            </div>

            {etudiantTab === "notes" ? (
              <NotesSection courses={courses} termsInOrder={termsInOrder} onOpenCourse={setOpenCourseId} />
            ) : (
              <ProfilSection />
            )}
          </>
        ) : activeTab === "ets" ? (
          <>
            <header style={{ paddingTop: 32, paddingBottom: 20 }}>
              <h1 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>ÉTS</h1>
            </header>
            <EtsSection />
          </>
        ) : activeTab === "plus" ? (
          plusPage === "about" ? (
            <AboutPage onBack={() => setPlusPage(null)} />
          ) : plusPage === "settings" ? (
            <SettingsPage onBack={() => setPlusPage(null)} />
          ) : plusPage && PLUS_PLACEHOLDER_CONTENT[plusPage] ? (
            <SimplePlaceholderPage
              title={PLUS_PLACEHOLDER_CONTENT[plusPage].title}
              paragraphs={PLUS_PLACEHOLDER_CONTENT[plusPage].paragraphs}
              onBack={() => setPlusPage(null)}
            />
          ) : (
            <>
              <header style={{ paddingTop: 32, paddingBottom: 8 }}>
                <h1 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>Plus</h1>
              </header>
              <PlusSection
                onNavigate={(key) => {
                  if (key === "logout") setShowLogoutConfirm(true);
                  else setPlusPage(key);
                }}
              />
            </>
          )
        ) : (
          <>
            <header style={{ paddingTop: 32, paddingBottom: 24 }}>
              <h1 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>Accueil</h1>
            </header>

            <HomeWidgets />

            <h2 style={{ fontSize: 22, fontWeight: 700, color: C.text, margin: "0 0 14px" }}>Notes</h2>

            <NotesSection
              courses={courses}
              termsInOrder={termsInOrder.filter((t) => t === "Automne 2026")}
              onOpenCourse={setOpenCourseId}
            />
          </>
        )}
      </div>

      <nav
        style={{
          position: "fixed",
          bottom: 0,
          left: 0,
          right: 0,
          backgroundColor: C.card,
          borderTop: `1px solid ${C.border}`,
          display: "flex",
          justifyContent: "center",
          gap: 20,
          padding: "10px 0 14px",
        }}
      >
        <button
          onClick={() => {
            setActiveTab("accueil");
            setOpenCourseId(null);
          }}
          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}
        >
          <GridIcon color={activeTab === "accueil" ? C.red : C.muted} size={22} />
          <span style={{ fontSize: 12, color: activeTab === "accueil" ? C.red : C.muted }}>Accueil</span>
        </button>
        <button
          onClick={() => {
            setActiveTab("horaire");
            setOpenCourseId(null);
          }}
          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}
        >
          <ClockIcon color={activeTab === "horaire" ? C.red : C.muted} size={22} />
          <span style={{ fontSize: 12, color: activeTab === "horaire" ? C.red : C.muted }}>Horaire</span>
        </button>
        <button
          onClick={() => {
            setActiveTab("etudiant");
            setOpenCourseId(null);
          }}
          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}
        >
          <GraduationCapIcon color={activeTab === "etudiant" ? C.red : C.muted} size={22} />
          <span style={{ fontSize: 12, color: activeTab === "etudiant" ? C.red : C.muted }}>Étudiant</span>
        </button>
        <button
          onClick={() => {
            setActiveTab("ets");
            setOpenCourseId(null);
          }}
          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}
        >
          <BuildingIcon color={activeTab === "ets" ? C.red : C.muted} size={22} />
          <span style={{ fontSize: 12, color: activeTab === "ets" ? C.red : C.muted }}>ÉTS</span>
        </button>
        <button
          onClick={() => {
            setActiveTab("plus");
            setOpenCourseId(null);
          }}
          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}
        >
          <HamburgerIcon color={activeTab === "plus" ? C.red : C.muted} size={22} />
          <span style={{ fontSize: 12, color: activeTab === "plus" ? C.red : C.muted }}>Plus</span>
        </button>
      </nav>

      {showLogoutConfirm && (
        <LogoutModal onConfirm={() => setShowLogoutConfirm(false)} onCancel={() => setShowLogoutConfirm(false)} />
      )}
    </div>
  );
}

// ---------- course detail (read-only) ----------
function CourseDetail({ course, onBack }) {
  const hasGrades = course.gradeItems.length > 0;

  if (!hasGrades) {
    return (
      <div style={{ paddingTop: 24 }}>
        <button
          onClick={onBack}
          style={{ background: "none", border: "none", color: C.muted, fontSize: 14, marginBottom: 16, padding: 0, cursor: "pointer" }}
        >
          ← retour
        </button>

        <h2 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>{course.code}</h2>
        <div style={{ fontSize: 15, color: C.textDim, marginTop: 4 }}>{course.name}</div>
        <div style={{ fontSize: 15, color: C.textDim }}>Groupe {course.group}</div>
        <div style={{ fontSize: 15, color: C.textDim, marginBottom: 16 }}>Crédits: {course.credits}</div>

        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "80px 20px 40px" }}>
          <GraduationCapIcon color={C.red} size={72} />
          <p style={{ fontSize: 17, color: C.text, marginTop: 24, marginBottom: 28 }}>Aucune note disponible</p>
          <button
            style={{
              backgroundColor: C.red,
              color: C.text,
              border: "none",
              borderRadius: 999,
              padding: "12px 32px",
              fontSize: 15,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            Réessayer
          </button>
        </div>
      </div>
    );
  }

  const finalPct = weightedAverage(course.gradeItems);
  const centerText = course.cote || (finalPct == null ? "—" : `${Math.round(finalPct)} %`);
  const totalWeight = course.gradeItems.reduce((s, gi) => s + gi.weight, 0);
  const yourPoints = course.gradeItems.reduce((s, gi) => s + (gi.score / gi.outOf) * gi.weight, 0);

  return (
    <div style={{ paddingTop: 24 }}>
      <button
        onClick={onBack}
        style={{ background: "none", border: "none", color: C.muted, fontSize: 14, marginBottom: 16, padding: 0, cursor: "pointer" }}
      >
        ← retour
      </button>

      <h2 style={{ fontSize: 24, fontWeight: 700, color: C.text, margin: 0 }}>{course.code}</h2>
      <div style={{ fontSize: 15, color: C.textDim, marginTop: 4 }}>{course.name}</div>
      {course.teacher && <div style={{ fontSize: 15, color: C.textDim }}>Enseignant: {course.teacher}</div>}
      <div style={{ fontSize: 15, color: C.textDim }}>Groupe {course.group}</div>
      <div style={{ fontSize: 15, color: C.textDim, marginBottom: 16 }}>Crédits: {course.credits}</div>

      <div
        style={{
          backgroundColor: C.card,
          border: `1px solid ${C.border}`,
          borderRadius: 16,
          padding: 16,
          display: "flex",
          alignItems: "center",
          gap: 20,
          marginBottom: 12,
        }}
      >
        <Gauge value={finalPct} size={90} centerText={centerText} />
        <div style={{ flex: 1 }}>
          <div style={{ color: C.green, fontWeight: 600 }}>
            {yourPoints.toFixed(1)}/{totalWeight.toFixed(1)} ({finalPct == null ? "—" : finalPct.toFixed(1)} %)
          </div>
          <div style={{ color: C.green, fontSize: 14, marginBottom: 8 }}>Votre note</div>
          <div style={{ color: "#FF6961", fontWeight: 600 }}>
            {course.moyenne.toFixed(1)}/100.0 ({course.moyenne.toFixed(1)} %)
          </div>
          <div style={{ color: "#FF6961", fontSize: 14 }}>Moyenne</div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <StatBox label="Médiane" value={`${course.mediane.toFixed(1)} %`} />
        <StatBox label="Écart-type" value={course.ecartType.toFixed(1)} />
        <StatBox label="Rang centile" value={course.rangCentile} />
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {course.gradeItems.map((gi) => {
          const pct = (gi.score / gi.outOf) * 100;
          return (
            <div
              key={gi.id}
              style={{
                backgroundColor: C.card,
                border: `1px solid ${C.border}`,
                borderRadius: 12,
                padding: "10px 12px",
                display: "flex",
                alignItems: "center",
                gap: 12,
              }}
            >
              <Gauge value={pct} size={52} centerText={`${Math.round(pct)}%`} />
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 14, color: C.text }}>{gi.name}</div>
                <div style={{ fontSize: 13, color: C.muted }}>Pondération : {gi.weight.toFixed(1)} %</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);</script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
